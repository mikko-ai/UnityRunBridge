name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 每日 UTC 16:00 ≈ 北京时间次日 00:00
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      matrix_set:
        description: 'Unity matrix set (pr|full)'
        required: false
        default: 'pr'
      visual_smoke:
        description: 'Run Game View smoke (requires an active macOS desktop)'
        type: boolean
        default: false

# 禁止任何 job 静默跳过 Unity 测试；runner 固定为预激活 self-hosted，无 hosted fallback。
env:
  UNITY_BIN: /Applications/Unity/Hub/Editor/2022.3.62f2/Unity.app/Contents/MacOS/Unity
  UNITY_FIXTURE_ROOT: ${{ github.workspace }}/.tmp/unity-fixtures
  UNITY_MATRIX_RESULTS: ${{ github.workspace }}/.tmp/test-results/matrix
  UNITY_MATRIX_LOGS: ${{ github.workspace }}/.tmp/logs/matrix

jobs:
  python:
    name: Python tests
    runs-on: [self-hosted, macOS, unity-2022.3.62f2]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            src/unityctl/.venv
          key: uv-${{ runner.os }}-${{ hashFiles('src/unityctl/uv.lock', 'src/unityctl/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Run Python tests
        run: bash scripts/run-python-tests.sh

  unity-matrix:
    name: Unity matrix (${{ github.event_name == 'schedule' && 'full' || (github.event_name == 'workflow_dispatch' && inputs.matrix_set || 'pr') }})
    runs-on: [self-hosted, macOS, unity-2022.3.62f2]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve matrix set
        id: set
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "name=full" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.matrix_set || 'pr' }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Unity fixture Library
        uses: actions/cache@v4
        with:
          path: |
            .tmp/unity-fixtures/**/Library
            .tmp/unity-fixtures/**/Packages/packages-lock.json
          key: unity-fixture-${{ runner.os }}-2022.3.62f2-${{ steps.set.outputs.name }}-${{ hashFiles('packages/com.mk.unity-agent-bridge/**/*.asmdef', 'packages/com.mk.unity-agent-bridge/package.json', 'scripts/create-unity-test-fixture.sh') }}
          restore-keys: |
            unity-fixture-${{ runner.os }}-2022.3.62f2-${{ steps.set.outputs.name }}-
            unity-fixture-${{ runner.os }}-2022.3.62f2-

      - name: Verify UNITY_BIN
        run: |
          if [[ ! -x "$UNITY_BIN" ]]; then
            echo "UNITY_BIN 不可执行：$UNITY_BIN"
            echo "本工作流禁止 fallback 到 hosted runner；请检查 self-hosted 机器预装与许可证。"
            exit 1
          fi
          "$UNITY_BIN" -version || true

      - name: Run Unity matrix
        run: bash scripts/run-unity-matrix.sh --set "${{ steps.set.outputs.name }}"

      - name: Extract first C# compile error
        if: failure()
        run: bash .github/scripts/extract-unity-first-error.sh "$UNITY_MATRIX_LOGS"

      - name: Upload Unity XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-matrix-xml-${{ steps.set.outputs.name }}-${{ github.run_id }}
          path: .tmp/test-results/matrix/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-matrix-logs-${{ steps.set.outputs.name }}-${{ github.run_id }}
          path: .tmp/logs/matrix/*.log
          if-no-files-found: warn
          retention-days: 14

  unity-smoke:
    name: UTF and Game View smoke
    runs-on: [self-hosted, macOS, unity-2022.3.62f2]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the built CLI wheel
        run: |
          out="$GITHUB_WORKSPACE/.tmp/ci-smoke-wheel/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          uv build --wheel src/unityctl --out-dir "$out"
          uv venv "$out/venv"
          uv pip install --no-deps --python "$out/venv/bin/python" "$out"/*.whl
          "$out/venv/bin/python" -c 'from importlib.resources import files; w = files("unityctl").joinpath("watch_assets"); assert all(w.joinpath(name).is_file() for name in ("index.html", "watch.css", "watch.js"))'
          echo "UNITYCTL_CI_PYTHON=$out/venv/bin/python" >> "$GITHUB_ENV"

      - name: Run UTF smoke
        run: >-
          "$UNITYCTL_CI_PYTHON" scripts/run-unity-smoke.py
          utf --output ".tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Run Game View smoke
        if: github.event_name == 'workflow_dispatch' && inputs.visual_smoke
        run: >-
          "$UNITYCTL_CI_PYTHON" scripts/run-unity-smoke.py
          visual --output ".tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Set up Node for optional GUI evidence
        if: github.event_name == 'workflow_dispatch' && inputs.visual_smoke
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/midscene-game-view/package-lock.json

      - name: Install adapter dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.visual_smoke
        working-directory: examples/midscene-game-view
        run: npm ci --ignore-scripts

      - name: Run installed UPM delivery and live observer smoke (no model)
        if: github.event_name == 'workflow_dispatch' && inputs.visual_smoke
        run: |
          out="$GITHUB_WORKSPACE/.tmp/unity-smoke/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          archive="$(DIST_DIR="$out/upm" bash scripts/package-upm.sh | tail -n 1)"
          test -f "$archive"
          "$UNITYCTL_CI_PYTHON" scripts/run-unity-smoke.py delivery --upm "$archive" --output "$out"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/test-report.json
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/results.xml
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/unity.log
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/editor.log
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/game-view-ready.txt
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/before.json
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/opened.json
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/closed.json
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/watch-*-evidence.json
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/agent-watch-live-evidence.json
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/unified-*.json
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/unity-offline-run-index.html
            .tmp/unity-smoke/${{ github.run_id }}-${{ github.run_attempt }}/**/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  midscene-adapter:
    name: Midscene adapter (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/midscene-game-view
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/midscene-game-view/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run adapter tests
        run: npm test

  package-upm:
    name: Package UPM
    runs-on: [self-hosted, macOS, unity-2022.3.62f2]
    timeout-minutes: 15
    needs: [python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package UPM tarball
        id: package
        run: |
          ARCHIVE_PATH="$(bash scripts/package-upm.sh | tail -n 1)"
          if [[ ! -f "$ARCHIVE_PATH" ]]; then
            echo "打包产物不存在：$ARCHIVE_PATH"
            exit 1
          fi
          echo "archive_path=${ARCHIVE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify schemas and tarball contents
        run: bash .github/scripts/verify-upm-package.sh "${{ steps.package.outputs.archive_path }}"

      - name: Upload UPM tarball
        uses: actions/upload-artifact@v4
        with:
          name: upm-package-${{ github.run_id }}
          path: ${{ steps.package.outputs.archive_path }}
          retention-days: 14
