name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-policy:
    name: Version policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify synchronized versions against the release batch
        run: python3 .github/scripts/check-version-policy.py --github-event "$GITHUB_EVENT_PATH"

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install uv==0.6.16

      - name: Run Python tests
        run: bash scripts/run-python-tests.sh

  midscene-adapter:
    name: Midscene adapter (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/midscene-game-view
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/midscene-game-view/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run adapter tests
        run: npm test

  package-upm:
    name: Package UPM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version-policy, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package UPM tarball
        id: package
        run: |
          ARCHIVE_PATH="$(bash scripts/package-upm.sh | tail -n 1)"
          if [[ ! -f "$ARCHIVE_PATH" ]]; then
            echo "打包产物不存在：$ARCHIVE_PATH"
            exit 1
          fi
          echo "archive_path=${ARCHIVE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify schemas and tarball contents
        run: bash .github/scripts/verify-upm-package.sh "${{ steps.package.outputs.archive_path }}"

      - name: Upload UPM tarball
        uses: actions/upload-artifact@v4
        with:
          name: upm-package-${{ github.run_id }}
          path: ${{ steps.package.outputs.archive_path }}
          retention-days: 14
