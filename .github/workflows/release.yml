name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release
        id: version
        run: bash .github/scripts/validate-release.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Python tests
        run: bash scripts/run-python-tests.sh

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Split and publish upm branch
        run: |
          git subtree split --prefix=packages/com.mk.unity-agent-bridge -b upm-split
          git push origin upm-split:upm --force
          git tag -f "upm/v${{ steps.version.outputs.version }}" upm-split
          git push origin "upm/v${{ steps.version.outputs.version }}" --force

      - name: Package UPM tarball
        id: package
        run: |
          # 脚本 stdout 包含进度信息，产物路径在最后一行
          ARCHIVE_PATH="$(bash scripts/package-upm.sh | tail -n 1)"
          if [ ! -f "$ARCHIVE_PATH" ]; then
            echo "打包产物不存在：$ARCHIVE_PATH"
            exit 1
          fi
          echo "archive_path=${ARCHIVE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build Python wheel and sdist
        id: python
        run: bash .github/scripts/package-python.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          bash .github/scripts/create-github-release.sh
          "${{ steps.package.outputs.archive_path }}"
          "${{ steps.python.outputs.wheel_path }}"
          "${{ steps.python.outputs.sdist_path }}"
