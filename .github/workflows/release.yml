name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 按 tag 分组排队，避免重复推送同一 tag（如 -f 强制改 tag 后重推）时
# 出现并发的发布流程；发布过程不允许被取消。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Unity EditMode 全量矩阵已移到本地执行（scripts/run-full-tests.sh，由
# scripts/bump-version.sh 在打 tag 前调用），因此这里全部使用 GitHub 托管
# runner，不再依赖任何 self-hosted 机器在线。
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release
        id: version
        run: bash .github/scripts/validate-release.sh

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Run Python tests
        run: bash scripts/run-python-tests.sh

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Unity 全量矩阵已在本地由 bump-version.sh 强制跑过才允许打 tag；
    # 这里只需等待 tag 校验与 Python 测试通过。
    needs: [validate, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Split and publish upm branch
        run: |
          git subtree split --prefix=packages/com.mk.unity-agent-bridge -b upm-split
          git push origin upm-split:upm --force
          git tag -f "upm/v${{ needs.validate.outputs.version }}" upm-split
          git push origin "upm/v${{ needs.validate.outputs.version }}" --force

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Package UPM tarball
        id: package
        run: |
          ARCHIVE_PATH="$(bash scripts/package-upm.sh | tail -n 1)"
          if [[ ! -f "$ARCHIVE_PATH" ]]; then
            echo "打包产物不存在：$ARCHIVE_PATH"
            exit 1
          fi
          echo "archive_path=${ARCHIVE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify schemas and tarball contents
        run: bash .github/scripts/verify-upm-package.sh "${{ steps.package.outputs.archive_path }}"

      - name: Build Python wheel and sdist
        id: python
        run: bash .github/scripts/package-python.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          bash .github/scripts/create-github-release.sh
          "${{ steps.package.outputs.archive_path }}"
          "${{ steps.python.outputs.wheel_path }}"
          "${{ steps.python.outputs.sdist_path }}"
